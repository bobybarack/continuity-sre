version: '3.8'

services:
  continuity-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: continuity-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - CONTINUITY_DB_PATH=/data/continuity_checkpoint.db
    volumes:
      - continuity-data:/data
    restart: unless-stopped

volumes:
  continuity-data:
    driver: local
