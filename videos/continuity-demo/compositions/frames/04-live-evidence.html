    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (() => {
        const id = "04-live-evidence";
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[id] = tl;

        const dashboardWindow = document.getElementById("04-live-evidence-window");
        const header = document.getElementById("04-live-evidence-header");
        const titleMask = document.getElementById("04-live-evidence-title-mask");
        const signalRail = document.getElementById("04-live-evidence-signal-rail");
        const targets = Array.from(document.querySelectorAll('[class~="04-live-evidence-target"]'));
        const signals = Array.from(document.querySelectorAll('[class~="04-live-evidence-signal"]'));
        const connectorLines = Array.from(document.querySelectorAll('[id="04-live-evidence-connectors"] path'));
        const prometheus = document.getElementById("04-live-evidence-prometheus");
        const loki = document.getElementById("04-live-evidence-loki");
        const prometheusLine = document.getElementById("04-live-evidence-prometheus-line");
        const lokiLine = document.getElementById("04-live-evidence-loki-line");
        const resolve = document.getElementById("04-live-evidence-resolve");
        const progress = document.querySelector('[id="04-live-evidence-progress"] span');

        gsap.set([targets, signals, connectorLines, prometheus, loki, resolve], { opacity: 0 });
        gsap.set(connectorLines, { strokeDasharray: "8 8", strokeDashoffset: 18 });
        gsap.set([prometheusLine, lokiLine], { strokeDasharray: 1800, strokeDashoffset: 1800, opacity: 0 });

        tl.fromTo(dashboardWindow, { opacity: 0.78, y: 18, scale: 0.992 }, { opacity: 1, y: 0, scale: 1, duration: 0.72, ease: "power2.out" }, 0);
        tl.fromTo(header, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" }, 0.12);
        tl.fromTo(titleMask, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.7);
        tl.fromTo(signalRail, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 2.72);

        const SIGNALS = [
          { key: "playback", label: "PLAYBACK FAILURES", weight: 17 },
          { key: "latency", label: "CDN LATENCY", weight: 11 },
          { key: "drm", label: "DRM HANDSHAKE", weight: 13 },
          { key: "viewers", label: "ACTIVE VIEWERS", weight: 14 },
          { key: "bitrate", label: "BITRATE", weight: 7 },
          { key: "buffer", label: "BUFFER HEALTH", weight: 13 }
        ];
        const revealSpan = 4.85;
        const totalWeight = SIGNALS.reduce((sum, item) => sum + item.weight, 0);
        let cursor = 3.0;
        const signalTimeline = SIGNALS.map((item) => {
          const share = revealSpan * (item.weight / totalWeight);
          const entry = { ...item, start: cursor, end: cursor + share };
          cursor += share;
          return entry;
        });

        signalTimeline.forEach((entry) => {
          const target = document.querySelector(`[class~="04-live-evidence-target"][data-target="${entry.key}"]`);
          const signal = document.querySelector(`[class~="04-live-evidence-signal"][data-signal="${entry.key}"]`);
          const line = document.querySelector(`[id="04-live-evidence-connectors"] path[data-line="${entry.key}"]`);
          tl.fromTo(signal, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.34, ease: "power2.out" }, entry.start);
          tl.fromTo(target, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.36, ease: "power2.out" }, entry.start + 0.08);
          tl.fromTo(line, { opacity: 0, strokeDashoffset: 18 }, { opacity: 0.9, strokeDashoffset: 0, duration: 0.42, ease: "none" }, entry.start + 0.16);
        });

        tl.fromTo(prometheus, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" }, 8.2);
        tl.fromTo(prometheusLine, { opacity: 0, strokeDashoffset: 1800 }, { opacity: 1, strokeDashoffset: 0, duration: 1.25, ease: "power1.inOut" }, 9.0);
        tl.fromTo(loki, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" }, 11.3);
        tl.fromTo(lokiLine, { opacity: 0, strokeDashoffset: 1800 }, { opacity: 1, strokeDashoffset: 0, duration: 0.86, ease: "power1.inOut" }, 11.72);
        tl.fromTo(resolve, { opacity: 0, scale: 0.93 }, { opacity: 1, scale: 1, duration: 0.62, ease: "back.out(1.35)" }, 12.45);

        const WORD_TIMINGS = {
          grafana: { start: 8.45, end: 8.82 },
          cloud: { start: 8.88, end: 9.24 },
          prometheus: { start: 9.34, end: 10.35 },
          loki: { start: 11.45, end: 12.15 },
          edge: { start: 12.22, end: 13.05 }
        };
        const wordDriver = { t: 0 };
        const words = Array.from(document.querySelectorAll('[class~="04-live-evidence-word"]'));
        let lastWordStyles = "";

        function envelope(time, start, end) {
          const attack = 0.18;
          const release = 0.42;
          const rest = 0.1;
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / attack, 1);
          if (time < end + release) return 1 - ((time - end) / release) * (1 - rest);
          return rest;
        }

        function mixChannel(a, b, amount) {
          return Math.round(a + (b - a) * amount);
        }

        tl.to(wordDriver, {
          t: 14,
          duration: 14,
          ease: "none",
          onUpdate: () => {
            const values = words.map((word) => {
              const timing = WORD_TIMINGS[word.dataset.word];
              const env = timing ? envelope(wordDriver.t, timing.start, timing.end) : 0;
              return { word, env };
            });
            const styleKey = values.map((value) => Math.round(value.env * 1000)).join("-");
            if (styleKey === lastWordStyles) return;
            values.forEach(({ word, env }) => {
              const r = mixChannel(154, 0, env);
              const g = mixChannel(154, 188, env);
              const b = mixChannel(154, 125, env);
              word.style.color = `rgb(${r}, ${g}, ${b})`;
              word.style.textShadow = `0 0 ${34 * env}px rgba(0, 188, 125, ${0.34 * env})`;
              word.style.transform = `scale(${1 + 0.16 * env})`;
            });
            lastWordStyles = styleKey;
          }
        }, 0);

        tl.to(progress, { width: "100%", duration: 14, ease: "none" }, 0);
      })();
    </script>
