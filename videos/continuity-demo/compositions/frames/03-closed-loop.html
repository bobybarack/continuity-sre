  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="03-closed-loop"]');
      const byId = (id) => root.querySelector(`[id="${id}"]`);
      const capture = byId("03-closed-loop-capture");
      const title = byId("03-closed-loop-title");
      const titleRule = byId("03-closed-loop-title-rule");
      const mask = byId("03-closed-loop-broadcast-mask");
      const hub = byId("03-closed-loop-hub");
      const hubPulse = byId("03-closed-loop-hub-pulse");
      const zoomOuter = byId("03-closed-loop-zoom-outer");
      const zoomInner = byId("03-closed-loop-zoom-inner");
      const progress = byId("03-closed-loop-progress-fill");
      const nodes = [
        byId("03-closed-loop-node-observe"),
        byId("03-closed-loop-node-reason"),
        byId("03-closed-loop-node-act"),
        byId("03-closed-loop-node-prove"),
      ];
      const spokes = [
        byId("03-closed-loop-spoke-observe"),
        byId("03-closed-loop-spoke-reason"),
        byId("03-closed-loop-spoke-act"),
        byId("03-closed-loop-spoke-prove"),
      ];
      const ringSegments = [
        byId("03-closed-loop-ring-observe-reason"),
        byId("03-closed-loop-ring-reason-act"),
        byId("03-closed-loop-ring-act-prove"),
        byId("03-closed-loop-ring-prove-observe"),
      ];
      const evidence = [
        byId("03-closed-loop-evidence-metrics"),
        byId("03-closed-loop-evidence-context"),
        byId("03-closed-loop-evidence-route"),
        byId("03-closed-loop-evidence-audit"),
      ];

      [...spokes, ...ringSegments].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        capture,
        { opacity: 0, y: 14, scale: 0.985 },
        { opacity: 1, y: 0, scale: 1, duration: 0.78, ease: "power3.out" },
        0.04,
      );
      tl.fromTo(
        title,
        { opacity: 0, y: 16, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "power3.out" },
        0.2,
      );
      tl.fromTo(
        titleRule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        0.72,
      );
      tl.fromTo(
        mask,
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
        1.15,
      );
      tl.fromTo(
        hub,
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.65, ease: "power3.out" },
        2.12,
      );
      tl.fromTo(
        progress,
        { scaleX: 0 },
        { scaleX: 0.3, duration: 2.7, ease: "power1.out" },
        0.1,
      );

      nodes.forEach((node, index) => {
        tl.fromTo(
          node,
          { scale: 0, opacity: 0, y: 10 },
          { scale: 1, opacity: 1, y: 0, duration: 0.66, ease: "power3.out" },
          2.82 + index * 0.76,
        );
      });
      tl.to(progress, { scaleX: 0.54, duration: 3.2, ease: "power1.inOut" }, 2.8);

      spokes.forEach((path, index) => {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },
          6 + index * 0.74,
        );
        tl.to(
          ringSegments[index],
          { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
          6.18 + index * 0.74,
        );
        tl.fromTo(
          evidence[index],
          { opacity: 0, scale: 0.92, y: 6 },
          { opacity: 1, scale: 1, y: 0, duration: 0.46, ease: "power3.out" },
          6.58 + index * 0.74,
        );
      });
      tl.to(progress, { scaleX: 0.8, duration: 3.3, ease: "power1.inOut" }, 6);

      tl.to(
        zoomOuter,
        { scale: 1.38, duration: 1.75, ease: "power3.inOut" },
        9.3,
      );
      tl.to(
        zoomInner,
        { x: 153, y: -89, duration: 1.75, ease: "power3.inOut" },
        9.3,
      );
      tl.to(
        capture,
        { "--dof": "8px", opacity: 0.38, duration: 1.2, ease: "power2.inOut" },
        9.3,
      );
      tl.to(progress, { scaleX: 1, duration: 1.75, ease: "power1.inOut" }, 9.3);
      tl.fromTo(
        hubPulse,
        { scale: 0.65, opacity: 0.4 },
        { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        10.82,
      );
      tl.to(hub, { opacity: 1, duration: 0.7, ease: "none" }, 11.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-closed-loop"] = tl;
    })();
