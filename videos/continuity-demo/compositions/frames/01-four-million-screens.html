      width: 650px;
      padding: 22px 28px 24px 30px;
      overflow: hidden;
      border-left: 4px solid #009966;
      border-radius: 0 12px 12px 0;
      background: rgba(255, 255, 255, 0.94);
      font-size: 3.1cqw;
      line-height: 1.03;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: #111827;
      z-index: 14;
    }

    .f01-four-million-screens-statement div {
      display: block;
      opacity: 0;
    }

    .f01-four-million-screens-progress-bar {
      position: absolute;
      left: 0;
      top: 888px;
      width: 9.5cqw;
      height: 3px;
      background: #009966;
      z-index: 15;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "01-four-million-screens";
      const compositionRoot = document.querySelector(`[data-composition-id="${compositionId}"]`);
      const tl = gsap.timeline({ paused: true });
      const counter = compositionRoot.querySelector("#f01-four-million-screens-counter");
      const suffix = compositionRoot.querySelector("#f01-four-million-screens-suffix");
      const tiles = Array.from(compositionRoot.querySelectorAll(".f01-four-million-screens-tile"));
      const paths = Array.from(compositionRoot.querySelectorAll(".f01-four-million-screens-fracture path"));
      const originX = 430;
      const originY = 382;
      const frame = 1 / 60;

      paths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const premiereStart = 0.08;
      const premiereDuration = 0.18;
      const nightStart = premiereStart + premiereDuration + (2 * frame);
      tl.set("#f01-four-million-screens-premiere", { opacity: 1, y: 74 }, premiereStart);
      tl.to("#f01-four-million-screens-premiere", { y: 0, duration: premiereDuration, ease: "power4.out" }, premiereStart);
      tl.set("#f01-four-million-screens-night", { opacity: 1, y: 44 }, nightStart);
      tl.to("#f01-four-million-screens-night", { y: 0, duration: 0.14, ease: "power4.out" }, nightStart);

      tl.fromTo(
        ".f01-four-million-screens-counter-block",
        { opacity: 0, y: 32 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.34,
      );
      tl.fromTo(
        "#f01-four-million-screens-viewer-label",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        0.72,
      );
      tl.set(suffix, { opacity: 0, y: 20 }, 0);

      const countState = { value: 0 };
      tl.to(
        countState,
        {
          value: 4.28,
          duration: 2.5,
          ease: "power3.out",
          onUpdate: () => {
            counter.textContent = countState.value.toFixed(2);
          },
        },
        2.2,
      );
      tl.fromTo(counter, { scale: 0.48 }, { scale: 1, duration: 2.5, ease: "power3.out" }, 2.2);
      tl.fromTo(
        suffix,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.38, ease: "back.out(1.6)" },
        4.7,
      );

      tiles.forEach((tile) => {
        const order = Number(tile.dataset.order);
        const wave = Number(tile.dataset.wave);
        const finalOpacity = Number(tile.dataset.opacity);
        const tileCenterX = tile.offsetLeft + (tile.offsetWidth / 2);
        const tileCenterY = tile.offsetTop + (tile.offsetHeight / 2);
        const spreadStart = 2.18 + (order * 0.085);
        const spreadDuration = 0.95 + Math.min(order, 8) * 0.03;
        const progressFill = tile.querySelector(".f01-four-million-screens-progress b");
        const ring = tile.querySelector(".f01-four-million-screens-buffer");
        const ringLength = ring.getTotalLength();

        ring.style.strokeDasharray = `${ringLength}`;
        ring.style.strokeDashoffset = `${ringLength}`;

        tl.fromTo(
          tile,
          {
            x: originX - tileCenterX,
            y: originY - tileCenterY,
            scale: 0.045,
            rotation: (order % 2 === 0) ? -3 : 3,
            opacity: 0,
          },
          {
            x: 0,
            y: 0,
            scale: 1,
            rotation: 0,
            opacity: finalOpacity,
            duration: spreadDuration,
            ease: "power3.out",
          },
          spreadStart,
        );
        tl.fromTo(
          progressFill,
          { scaleX: 0.08 },
          { scaleX: 0.48 + ((order % 5) * 0.085), duration: spreadDuration, ease: "power3.out" },
          spreadStart,
        );
        tl.fromTo(
          ring,
          { strokeDashoffset: ringLength },
          { strokeDashoffset: ringLength * 0.18, duration: spreadDuration, ease: "power3.out" },
          spreadStart,
        );
        tl.to(
          ring,
          {
            strokeDashoffset: ringLength,
            stroke: "#dc2626",
            duration: 0.62,
            ease: "power2.out",
          },
          5.72 + (wave * 0.085),
        );
      });

      tl.to("#f01-four-million-screens-route-a", { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, 5.24);
      tl.to("#f01-four-million-screens-route-b", { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" }, 5.64);
      tl.to("#f01-four-million-screens-route-c", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 5.98);
      tl.fromTo(
        "#f01-four-million-screens-transit",
        { opacity: 0, scale: 0.78 },
        { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.5)" },
        6.14,
      );
      tl.fromTo(
        "#f01-four-million-screens-alert-indicator",
        { opacity: 0, scale: 0.62 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)" },
        6.28,
      );

      tl.set("#f01-four-million-screens-line-one", { opacity: 1, y: 72 }, 8.02);
      tl.to("#f01-four-million-screens-line-one", { y: 0, duration: 0.2, ease: "power4.out" }, 8.02);
      tl.set("#f01-four-million-screens-line-two", { opacity: 1, y: 54 }, 8.26);
      tl.to("#f01-four-million-screens-line-two", { y: 0, duration: 0.17, ease: "power4.out" }, 8.26);

      const alertIndicator = "#f01-four-million-screens-alert-indicator";
      tl.to(alertIndicator, { x: 2, y: -1, duration: 0.07, ease: "power1.inOut" }, 8.55);
      tl.to(alertIndicator, { x: -2, y: 1, duration: 0.07, ease: "power1.inOut" }, 8.78);
      tl.to(alertIndicator, { x: 1, y: 0, duration: 0.07, ease: "power1.inOut" }, 9.02);
      tl.to(alertIndicator, { x: -1, y: -1, duration: 0.07, ease: "power1.inOut" }, 9.28);
      tl.to(alertIndicator, { x: 2, y: 1, duration: 0.07, ease: "power1.inOut" }, 9.55);
      tl.to(alertIndicator, { x: 0, y: 0, duration: 0.07, ease: "power1.inOut" }, 9.82);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-four-million-screens"] = tl;
    })();
  </script>
</template>
